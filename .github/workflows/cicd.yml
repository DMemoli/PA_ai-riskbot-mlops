name: RiskBot - MLOps CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: riskbot-production
  cancel-in-progress: false

jobs:
  evaluacion_y_despliegue:
    name: Evaluación y despliegue controlado
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      PYTHONUNBUFFERED: "1"
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-3.5-flash-lite
      GEMINI_ALLOWED_MODELS: gemini-3.5-flash-lite,gemini-3.1-flash-lite
      EVAL_MODEL: gemini-3.5-flash-lite
      EVAL_PAUSA_SEGUNDOS: "30"
      EVAL_MAX_REINTENTOS: "3"
      EVAL_RETRY_SEGUNDOS: "60"
      EVAL_RELEVANCIA_MINIMA: "0.75"

    steps:
      - name: Clonar el commit a evaluar
        uses: actions/checkout@v5

      - name: Configurar Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Instalar dependencias para las pruebas
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt
          python -m pip check

      - name: Verificar archivos, sintaxis y contrato de la API
        run: |
          python -m py_compile main.py eval.py
          python -m pytest -q

      - name: Validar disponibilidad de la clave de Gemini
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::Falta el secreto GEMINI_API_KEY en GitHub Actions"
            exit 1
          fi

      - name: Evaluación MLOps (20 seguridad + 20 funcionales)
        run: python -u eval.py

      - name: Conservar métricas y resultados de MLflow
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riskbot-mlflow-${{ github.run_id }}
          path: |
            mlflow.db
            mlruns/
          if-no-files-found: ignore
          retention-days: 14

      - name: Desplegar en Render solamente si aprueban las evaluaciones
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::error::Falta el secreto RENDER_DEPLOY_HOOK en GitHub Actions"
            exit 1
          fi
          if [[ "$RENDER_DEPLOY_HOOK" == *"?"* ]]; then
            DEPLOY_URL="${RENDER_DEPLOY_HOOK}&ref=${GITHUB_SHA}"
          else
            DEPLOY_URL="${RENDER_DEPLOY_HOOK}?ref=${GITHUB_SHA}"
          fi
          echo "Evaluaciones aprobadas. Solicitando a Render el despliegue del commit ${GITHUB_SHA}."
          curl --fail-with-body --show-error --silent \
            --max-time 60 \
            --request POST "$DEPLOY_URL"
          echo "Solicitud de despliegue enviada; revisar en Render hasta que figure Live."
